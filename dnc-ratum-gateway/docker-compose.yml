version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dnc-ratum-gateway_datum_1
      APP_PORT: 21001

  datum:
    image: ghcr.io/rleed/umbrel-ratum-gateway:latest
    entrypoint: ["/app/ratum-gateway"]
    command: ["--config=/app/conf/datum_gateway_config.json"]
    user: 10001:10001
    restart: on-failure
    # Match Debian's DATUM Gateway systemd service (LimitNOFILE=65535).
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ${APP_DATA_DIR}/data/settings/:/app/conf/
    ports:
      # datum gateway port
      - 23334:23334
